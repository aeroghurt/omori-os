<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmoriOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="laptop" class="container" style="position: absolute; width: 100%; height: 100%; background-color: black; align-items: center;">
        <div id="computer">
            <img src="assets/laptop-bg.jpeg">
            <div class="computer-hud">
                <button type="button" style="font-family: 'Tiny5'; color: black; letter-spacing: 4px; font-size: 2rem;">START</button>
                <div></div>
                <button class="time" type="button" style="font-family: 'omori'; color: black; font-size: 2cqw;">0:00 AM</button>
            </div>
        </div>
        <div id="journal-container">
            <div id="journal">
                <div class="handle">
                    <div class="app-name">
                        <p>AEROGHURT'S JOURNAL</p>
                    </div>
                    <button type="button" class="close-button">
                        <img src="assets/x.png">
                    </button>
                </div>
                <div class="screen">
                    
                </div>
            </div>
        </div>
        
        <div id="laptop-start" class="textbox">
            <h1 class="typewriter">
                <!-- You booted up your laptop. -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div>
        <div class="textbox">
            <h1 class="typewriter">
                What would you like to do?
            </h1>
        </div>
        <div class="textbox3">
            <div class="option" style="gap: 1%">
              <img src="assets/hand.png" class="backnforth laptopOptions">
            <h1>
                STARE AT THE SCREEN
            </h1>  
            </div>
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth laptopOptions">
            <h1>
                OPEN YOUR JOURNAL
            </h1>
            </div>
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth laptopOptions">
            <h1>
                LOG OFF
            </h1>
            </div>
        </div>
        <div class="textbox" id="stared">
            <h1 class="typewriter">
                <!-- You stared at the screen. -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div>
        <div class="textbox" id="loggedOff">
            <h1 class="typewriter">
                <!-- The heat from the laptop warmed your lap. It felt nice. -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div>
    </div>

    <div id="sketchpad" class="container">
        <div id="sketchbook">
            <canvas id="sketchCanvas"></canvas>
            <div id="selectionBar">
                <img src="assets/pen.png" id="pen">
                <img src="assets/eraser.png" id="eraser">
                <div id="clear-canvas">
                    <!-- doesn't do anything cool im sorry -->
                    <button>Self-destruct</button>
                </div>
                <img src="assets/close.png" id="close">
                <div id="color">
                    <h1 style="color: white; font-size: 2rem;">Color</h1>
                    <input type="color" id="color-picker" name="color-picker">
                </div>
                <div id="change-size">
                    <p>Change size</p>
                    <div>
                        <button class="size"><img src="assets/size1.png"></button>
                        <button class="size"><img src="assets/size2.png"></button>
                        <button class="size"><img src="assets/size3.png"></button>
                        <button class="size"><img src="assets/size4.png"></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="textbox" id="sketchText">
                <h1 class="typewriter">
                    <!-- Your sketchbook. Take a look inside? -->
                </h1>
        </div>
        <div class="textbox2">
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth sketchbookOptions">
                <h1>
                    YES
                </h1>
            </div>
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth sketchbookOptions">
                <h1>
                    NO
                </h1>
            </div>
        </div>
    </div>

    <div id="cat" class="container">
        <div id="mewo" class="textbox">
            <h1 class="typewriter">
                <!-- Meow? (Waiting for something to happen?) -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div> 
    </div>

    <div id="game-container">
        <div id="game-window">
            <div class="handle">
                <div class="app-name">
                    <p>MEWO</p>
                </div>
                <button type="button" class="close-button">
                    <img src="assets/x.png">
                </button>
            </div>
            <div class="screen">
                <div id="items">
                    <button class="food">Kibble Nibble™</button>
                    <button class="food">Salmon</button>
                    <button class="food">Tuna</button>
                    <button class="toy">Laser</button>
                </div>
                <div id="chillin-spot">
                    <img src="assets/mewo.gif">
                </div>
                <div id="stats">
                    <p>HUNGER</p>
                    <div class="progress-bar" id="hunger">
                        <div class="value" style="width: 100%"></div>
                    </div>
                    <p>BOREDOM</p>
                    <div class="progress-bar" id="boredom">
                        <div class="value" style="width: 100%"></div>
                    </div>
                    <p>TRUST</p>
                    <div class="progress-bar" id="trust">
                        <div class="value" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="box-of-tissues" class="container">
        <div id="tissues" class="textbox">
            <h1 class="typewriter">
                <!-- A tissue box for wiping your sorrows away. -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div> 
    </div>

    <canvas id="canvas" width="320" height="180"></canvas>

    <script src="index.js" type="module" defer></script>
    <script src="animations.js" type="module" defer></script>
    <script src="camera.js" type="module" defer></script>
    <script src="camera.js" type="module" defer></script>
    <script src="frameIndexPattern.js" type="module" defer></script>
    <script src="gameLoop.js" type="module" defer></script>
    <script src="gameObject.js" type="module" defer></script>
    <script src="grid.js" type="module" defer></script>
    <script src="input.js" type="module" defer></script>
    <script src="map.js" type="module" defer></script>
    <script src="moveTowards.js" type="module" defer></script>
    <script src="objectAnimations.js" type="module" defer></script>
    <script src="omoriAnimations.js" type="module" defer></script>
    <script src="resource.js" type="module" defer></script>
    <script src="revealingText.js" type="module" defer></script>
    <script src="sprite.js" type="module" defer></script>
    <script src="vector2.js" type="module" defer></script>
</body>
</html>
