<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmoriOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="laptop" class="container" style="position: absolute; width: 100%; height: 100%; background-color: black; align-items: center;">
        <div id="computer">
            <img src="assets/laptop-bg.jpeg">
            <div class="computer-hud">
                <button type="button" style="font-family: 'Tiny5'; color: black; letter-spacing: 4px; font-size: 2rem;">START</button>
                <div></div>
                <button class="time" type="button" style="font-family: 'omori'; color: black; font-size: 1.9rem;">0:00 AM</button>
            </div>
        </div>
        <div id="journal">

        </div>
        <div class="textbox">
            <h1 class="typewriter">
                What would you like to do?
            </h1>
        </div>
        <div class="textbox3">
            <div class="option" style="gap: 1%">
              <img src="assets/hand.png" class="backnforth">
            <h1>
                STARE AT YOUR SCREEN
            </h1>  
            </div>
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth">
            <h1>
                OPEN YOUR JOURNAL
            </h1>
            </div>
            <div class="option" style="gap: 1%">
                <img src="assets/hand.png" class="backnforth">
            <h1>
                LOG OFF
            </h1>
            </div>
        </div>
        <div id="laptop-start" class="textbox">
            <h1 class="typewriter">
                <!-- You booted up your laptop. -->
            </h1>
            <img src="assets/hand.png" class="backnforth">
        </div>
    </div>

    <div id="sketchpad" class="container">
        <div id="sketchbook">
            
        </div>
        <div class="textbox">
                <h1 class="typewriter">
                    Your sketchbook. Take a look inside?
                </h1>
            </div>
            <div class="textbox2">
                <div class="option">
                <img src="assets/hand.png" class="backnforth">
                <h1>
                    YES
                </h1>  
                </div>
                <div class="option">
                    <img src="assets/hand.png" class="backnforth">
                <h1>
                    NO
                </h1>
                </div>
            </div>
    </div>
    
    <canvas id="canvas" width="320" height="180">

    </canvas>

    <script src="index.js" type="module" defer></script>
</body>
</html>
